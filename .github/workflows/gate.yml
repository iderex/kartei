# The gate: five checks that judge the code, each reported under its own name.
#
# A ruleset can only require a check by its literal check-run name, so the names
# are the interface and are chosen here rather than inherited from whatever the
# job or the file happens to be called. Every job below carries an explicit
# `name:`, which fixes the check-run name; renaming a job silently stops it being
# required and nothing announces that, so the name is treated as a promise.
#
# One job per leg rather than one job with several steps. A single job reports
# one result, so a reader of the required-checks list cannot tell which leg
# failed, and a leg that stops being run cannot stop being green on its own.
#
# The names are lowercase and say what they are: build, test, format, lint,
# msrv. The first keeps the name the gate this one is measured against already
# uses, and the tree already carries `dependency-review` in the same style.
#
# `msrv` is named for the thing rather than for the number. Putting the version
# in the check-run name would mean that raising the floor renames the check, and
# a ruleset requiring the old name would stop matching with nothing announcing
# it, which is the failure the paragraph above is about.
#
# Every job runs on `pull_request` for every branch and needs nothing but
# `contents: read`, so a pull request from a fork produces the same result as one
# from a branch here. A check that cannot run on a fork's pull request is not a
# gating check.
#
# The toolchain is `rust-toolchain.toml`, which rustup reads before any command
# below runs, so every job here compiles with the compiler the repository names
# and not the one the runner image happens to ship. The `msrv` job is the one
# exception, and it overrides it deliberately.
name: Gate

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Deny by default at the workflow level; each job grants only what it needs.
permissions: {}

# A newer push on the same ref supersedes an in-flight run. These jobs only
# judge, they publish nothing, so cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not leave the token in .git/config.
          persist-credentials: false
      - name: Build the workspace with warnings denied
        # --locked so the committed lockfile is the thing that is built, and a
        # dependency added without updating it reds here rather than resolving
        # to something nobody reviewed. --all-targets so tests and examples are
        # compiled too, not only the library and the binary.
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --workspace --locked --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the suite
        # Separate from build on purpose: a green build must not be readable as
        # a green suite.
        run: |
          set -euo pipefail
          cargo test --workspace --locked 2>&1 | tee suite.log
      - name: Say what the run covered
        # Disclosure, and it refuses nothing. `cargo test --workspace` runs the
        # test targets it can build and prints nothing about the ones it did
        # not, so a workspace that holds a suite back behind a feature produces
        # exactly the log of one that has no such suite. That case is already
        # live here: `kartei-testing`'s GPU target carries `required-features`
        # and is deliberately out of the gate, and until this step the log gave
        # a reader no way to see it.
        #
        # The declaration and the run are read from the same manifests, so this
        # cannot see a target that left the manifest altogether: a member
        # dropped from the workspace, or a target switched off with
        # `test = false`, disappears from both sides at once. What it makes
        # readable is the gap between what the tree declares and what this run
        # executed, which is the shape a feature gate produces.
        run: |
          set -euo pipefail
          cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[]
                     | .name as $p
                     | .targets[]
                     | select(.test)
                     | [$p, .name, ((.["required-features"] // []) | join(","))]
                     | @tsv' \
            | sort > declared.tsv
          ran=0
          held=0
          absent=0
          while IFS=$(printf '\t') read -r package target features; do
            # The binary a target builds carries the target name with hyphens
            # turned into underscores, which is what the log's Running line
            # shows.
            binary=${target//-/_}
            if grep -q "deps/${binary}-" suite.log; then
              echo "ran        ${package} ${target}"
              ran=$((ran + 1))
            elif [ -n "${features}" ]; then
              echo "held out   ${package} ${target}, requires feature: ${features}"
              held=$((held + 1))
            else
              echo "not run    ${package} ${target}"
              absent=$((absent + 1))
            fi
          done < declared.tsv
          # `|| true` on each grep because no match is a count of zero here and
          # not a failure, and `pipefail` would otherwise end the step on the
          # day the suite reports neither.
          ignored=$( { grep -o '[0-9]* ignored' suite.log || true; } | cut -d' ' -f1 \
            | awk '{ total += $1 } END { print total + 0 }')
          filtered=$( { grep -o '[0-9]* filtered out' suite.log || true; } | cut -d' ' -f1 \
            | awk '{ total += $1 } END { print total + 0 }')
          echo "${ran} declared test target(s) ran, ${held} held out behind a feature, ${absent} neither."
          echo "${ignored} test(s) ignored and ${filtered} filtered out across the run."

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        # --check reports and fails; it does not rewrite. A gate that reformats
        # would hide the thing it is meant to report.
        run: cargo fmt --all --check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the floor out of the workspace manifest
        id: floor
        # Read, never restated. The floor lives in one place, `rust-version` in
        # `[workspace.package]`, and every member inherits it. A number typed
        # here as well would be a second copy that drifts, and the drift would
        # show up as a green gate against a floor nobody supports any more.
        #
        # Fail closed in three directions. A member that does not inherit shows
        # up as `null`, two members that disagree show up as two values, and an
        # empty answer means the query itself stopped working. None of those may
        # be read as "the floor is fine".
        run: |
          set -euo pipefail
          floors=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '[.packages[].rust_version] | unique | .[]')
          if [ -z "$floors" ]; then
            echo "::error::no package reported a rust-version, so there is no floor to build against."
            exit 1
          fi
          if [ "$(printf '%s\n' "$floors" | wc -l)" -ne 1 ]; then
            echo "::error::the workspace states more than one floor, so no single toolchain answers for it: $(printf '%s' "$floors" | tr '\n' ' ')"
            exit 1
          fi
          if [ "$floors" = "null" ]; then
            echo "::error::a package does not inherit rust-version, so the floor is not stated for the whole workspace."
            exit 1
          fi
          echo "Floor read from the manifest: $floors"
          echo "floor=$floors" >> "$GITHUB_OUTPUT"
      - name: Install the floor toolchain
        # Through the environment rather than interpolated into the script, so a
        # value that reached the manifest could never be evaluated as shell.
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: rustup toolchain install "$FLOOR" --profile minimal --no-self-update
      - name: Build the workspace with the floor toolchain
        # The same flags the build leg uses, with the floor selected explicitly.
        # A language feature that needs something newer reds here, which is the
        # point: raising the floor becomes a change somebody makes on purpose.
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
          RUSTFLAGS: "-D warnings"
        run: cargo "+$FLOOR" build --workspace --locked --all-targets
