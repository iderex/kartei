name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job, so the check-run name is the job id,
  # `dependency-review`. That string is the only thing a ruleset can match, so
  # renaming the job renames the check, and a rule requiring the old name stops
  # matching with nothing announcing it. Setting `name:` here is fine as long as
  # the ruleset moves in the same change; leaving the two out of step is what is
  # not.
  #
  # Whether anything requires this check is a property of the ruleset and not of
  # this file, so this comment does not assert it either way. #6 owns that half
  # and carries the command that reads the required list.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
